name: Validate MCP Server Schema & Stdio Protocol

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Test server.json & 11-Tool MCP JSON-RPC 2.0 Launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run @ciphermap/mcp Unit & JSON-RPC Introspection Tests
        run: node --test packages/ciphermap-mcp/test.mjs
