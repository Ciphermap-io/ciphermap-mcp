name: Publish to npm (Trusted OIDC Provenance) & Official MCP Registry

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22 & latest npm for OIDC Trusted Publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Run @ciphermap/mcp Unit & Dual-Framing Stdio Tests
        run: node --test packages/ciphermap-mcp/test.mjs

      - name: Publish @ciphermap/mcp to npm via Keyless OIDC + SLSA Provenance (when packages[] declared)
        run: |
          set -euo pipefail
          HAS_NPM_PKG="$(jq -r '[.packages[]? | select(.registryType=="npm")] | length' server.json)"
          if [ "$HAS_NPM_PKG" = "0" ]; then
            echo "ℹ️ server.json does not declare an npm packages[] entry yet; skipping npm OIDC publish step."
            exit 0
          fi
          PKG_NAME="$(jq -r '.name' packages/ciphermap-mcp/package.json)"
          PKG_VER="$(jq -r '.version' packages/ciphermap-mcp/package.json)"
          HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@ciphermap%2fmcp/${PKG_VER}" || true)"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ ${PKG_NAME}@${PKG_VER} is already published on registry.npmjs.org; skipping duplicate npm publish."
          else
            npm install -g npm@latest
            (cd packages/ciphermap-mcp && chmod 0755 bin/ciphermap-mcp.js && npm publish --provenance --access public)
            for attempt in $(seq 1 15); do
              CHECK_CODE="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@ciphermap%2fmcp/${PKG_VER}" || true)"
              if [ "$CHECK_CODE" = "200" ]; then
                echo "✅ Verified ${PKG_NAME}@${PKG_VER} live on registry.npmjs.org"
                break
              fi
              sleep 2
            done
          fi

      - name: Install mcp-publisher v1.8.9
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher

      - name: Validate & Publish to Official MCP Registry via GitHub OIDC (Idempotent)
        run: |
          set -euo pipefail
          /tmp/mcp-publisher validate
          SERVER_NAME="$(jq -r '.name' server.json)"
          SERVER_VER="$(jq -r '.version' server.json)"
          EXISTING="$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=ciphermap" | jq -r --arg n "$SERVER_NAME" --arg v "$SERVER_VER" '.servers[]? | select(.server.name==$n and .server.version==$v) | .server.version' | head -n 1 || true)"
          if [ "$EXISTING" = "$SERVER_VER" ]; then
            echo "✅ ${SERVER_NAME}@${SERVER_VER} is already published on registry.modelcontextprotocol.io; skipping duplicate publish."
            exit 0
          fi
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
